version: "3.9"

services:
  # ============================================================
  # PostgreSQL Database
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: indago-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: indago
      POSTGRES_PASSWORD: indago_secret
      POSTGRES_DB: indago_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indago -d indago_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Redis (Task Queue + Cache)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: indago-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # MinIO Object Storage (S3-compatible)
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: indago-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: indago_access
      MINIO_ROOT_PASSWORD: indago_secret_key
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ============================================================
  # INDAGO Backend API
  # ============================================================
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: indago-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://indago:indago_secret@postgres:5432/indago_db
      DATABASE_URL_SYNC: postgresql://indago:indago_secret@postgres:5432/indago_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: indago_access
      S3_SECRET_KEY: indago_secret_key
      EVIDENCE_BASE_PATH: /evidence_storage
      DEBUG: "false"
    volumes:
      - evidence_storage:/evidence_storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============================================================
  # Celery Worker (Forensic Capture)
  # ============================================================
  celery-worker:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: indago-worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker -Q capture,reports -c 3 --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://indago:indago_secret@postgres:5432/indago_db
      DATABASE_URL_SYNC: postgresql://indago:indago_secret@postgres:5432/indago_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: indago_access
      S3_SECRET_KEY: indago_secret_key
      EVIDENCE_BASE_PATH: /evidence_storage
    volumes:
      - evidence_storage:/evidence_storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================
  # Celery Beat (Scheduler)
  # ============================================================
  celery-beat:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: indago-beat
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=info -s /tmp/celerybeat-schedule
    environment:
      DATABASE_URL: postgresql+asyncpg://indago:indago_secret@postgres:5432/indago_db
      DATABASE_URL_SYNC: postgresql://indago:indago_secret@postgres:5432/indago_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - redis

  # ============================================================
  # INDAGO Frontend
  # ============================================================
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    container_name: indago-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # ============================================================
  # Nginx Reverse Proxy
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: indago-nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  minio_data:
  evidence_storage:

networks:
  default:
    name: indago-network
